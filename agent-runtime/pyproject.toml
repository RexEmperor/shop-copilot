[project]
name = "agent-runtime"
version = "0.1.0"
description = "Shop copilot agent runtime: LLM orchestration with FastAPI + LangGraph"
readme = "README.md"
authors = [
    { name = "RexEmperor", email = "1564200378@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncmy>=0.2.18",
    "fastapi>=0.162.5",
    "gradio>=6.32.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langfuse>=5.2.0",
    "langgraph>=1.2.24",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
