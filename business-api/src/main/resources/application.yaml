server:
  port: 8080
spring:
  application:
    name: business-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${MYSQL_ROOT_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  ai:
    mcp:
      server:
        name: shop-copilot-business-mcp
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC

app:
  cache:
    product-ttl-seconds: ${PRODUCT_CACHE_TTL_SECONDS:300}
    product-ttl-jitter-seconds: ${PRODUCT_CACHE_TTL_JITTER_SECONDS:30}
    product-null-ttl-seconds: ${PRODUCT_CACHE_NULL_TTL_SECONDS:60}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
