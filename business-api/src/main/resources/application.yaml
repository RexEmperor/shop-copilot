server:
  port: 8080
spring:
  application:
    name: business-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:${MYSQL_ROOT_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  ai:
    mcp:
      server:
        name: shop-copilot-business-mcp
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC

app:
  cache:
    product-ttl-seconds: ${PRODUCT_CACHE_TTL_SECONDS:300}
    product-ttl-jitter-seconds: ${PRODUCT_CACHE_TTL_JITTER_SECONDS:30}
    product-null-ttl-seconds: ${PRODUCT_CACHE_NULL_TTL_SECONDS:60}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  mq:
    enabled: ${ROCKETMQ_ENABLED:false}
    namesrv-addr: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:shop-copilot-business-producer}
    consumer-group: ${ROCKETMQ_CONSUMER_GROUP:shop-copilot-agent-dispatcher}
    order-topic: ${ROCKETMQ_ORDER_TOPIC:shop-copilot-order-events}
    product-topic: ${ROCKETMQ_PRODUCT_TOPIC:shop-copilot-product-events}
    agent-runtime-base-url: ${AGENT_RUNTIME_BASE_URL:http://127.0.0.1:8000}
    consume-dedup-ttl-seconds: ${ROCKETMQ_DEDUP_TTL_SECONDS:86400}
